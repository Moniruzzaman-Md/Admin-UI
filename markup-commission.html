<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hotel Markup · Admin Redesign</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32x32.png?v=2">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon/favicon-16x16.png?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.png?v=2">
<link rel="stylesheet" href="css/tokens.css?v=26">
<link rel="stylesheet" href="css/shell.css?v=30">
<link rel="stylesheet" href="css/components.css?v=48">
<link rel="stylesheet" href="css/skeleton.css?v=26">
<link rel="stylesheet" href="css/table.css?v=74">
<link rel="stylesheet" href="css/select.css?v=26">
<link rel="stylesheet" href="css/modal.css?v=2">
<link rel="stylesheet" href="css/history.css?v=33">
<style>
  .filter-bar > .f-id { width: 160px; }
  @media (max-width: 640px) { .filter-bar > .f-id { width: 100%; } }
  .page-head { padding: 0 8px; }
  .title-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  /* prototype-only link (dashed = an annotation, not portal UI) */
  .dev-link { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border: 1px dashed #b9bde0; border-radius: 999px; color: #4a4fa8; background: #fff; font-size: 12px; font-weight: 600; line-height: 20px; text-decoration: none; }
  .dev-link:hover { border-style: solid; background: #f0f1fb; }
  .dev-link:focus-visible { outline: 2px solid var(--brand-accent); outline-offset: 2px; }
  .field .lbl { font-size: var(--fs-sm); font-weight: 500; color: var(--text-2); }
  .field .lbl .req { color: var(--red); margin-left: 2px; }
  .field .searchable-select { display: flex; width: 100%; }
  .field.invalid .searchable-select-trigger { border-color: var(--red); }
  .seg-radio { display: flex; }
  .seg-radio label { flex: 1; display: flex; align-items: center; justify-content: center; height: 34px; padding: 0 12px; border-radius: calc(var(--radius-sm) - 2px); font-size: var(--fs-sm); font-weight: 500; color: var(--text-2); cursor: pointer; }
  .seg-radio input { position: absolute; opacity: 0; pointer-events: none; }
  .seg-radio label:has(input:checked) { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); }
  .seg-radio label:has(input:focus-visible) { outline: 2px solid var(--brand-accent); outline-offset: 1px; }
  .input-affix { position: relative; }
  .input-affix .input { width: 100%; padding-right: 40px; }
  .input-affix .affix { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-size: var(--fs-sm); font-weight: 500; color: var(--text-3); pointer-events: none; }
  .input-affix .affix:empty { display: none; }
  .hist-name { color: #6b6b85; font-weight: 600; }
  .field[hidden] { display: none; }
  .field.invalid .hint { display: none; }
  .tbl-area.is-loading tbody { opacity: .45; pointer-events: none; transition: opacity .15s; }
  .ovl-opt { display: inline-flex; align-items: center; gap: 8px; margin-right: auto; font-size: var(--fs-sm); font-weight: 500; color: var(--text-2); cursor: pointer; }
  .ovl-opt input { width: 16px; height: 16px; margin: 0; accent-color: var(--brand-accent); cursor: pointer; }
  /* overlap screen (inside the shared modal) */
  .ovl-msgs { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .ovl-msg { display: flex; align-items: flex-start; gap: 8px; padding: 8px 10px; border-radius: 6px; font-size: var(--fs-sm); line-height: 1.5; background: #fff6e5; color: #8a5300; }
  .ovl-msg.danger { background: #fdecee; color: #b3261e; }
  .ovl-msg.info { background: #e8f1fd; color: #1d5fb8; }
  .ovl-msg svg { flex: none; width: 12px; height: 12px; margin-top: 4px; }
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body data-page="markup-commission">

<main class="shell-main">
  <div class="page-head">
    <div class="title-row">
      <h1 class="page-title">Default Markup (Hotel)</h1>
      <!-- prototype only: not part of the real portal -->
      <a class="dev-link" href="markup-commission-backend.html" target="_blank" rel="noopener" data-tooltip="Backend guide for developers (MySQL schema, overlap queries, API). Opens in a new tab.">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 9l-4 3 4 3M16 9l4 3-4 3M14 5l-4 14"/></svg>Backend guide
      </a>
    </div>
    <button class="btn btn-primary" id="btn-new" type="button">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      New Markup
    </button>
  </div>

  <section class="card" aria-label="Hotel markup list">
    <div class="filter-bar" id="filter-bar">
      <div class="search-input f-id">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input class="input" id="f-id" type="text" inputmode="numeric" placeholder="ID" aria-label="Find by markup ID">
      </div>
      <button class="btn btn-primary" type="button" data-filters-go>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="7.5"/><path d="m20.5 20.5-4-4"/></svg>
        Search
      </button>
      <button class="filters-toggle-btn" type="button" data-filters-toggle aria-expanded="false" aria-controls="filters-panel">
        Filters <span class="filters-count" data-filters-count hidden></span>
        <svg class="chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="btn btn-reset" type="button" data-filters-reset>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 12a9 9 0 109-9 9 9 0 00-7 3.3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M3 3.5V8h4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Reset
      </button>
      <button class="btn btn-secondary push-right" id="btn-check" type="button">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="12" height="12" rx="2"/><rect x="9" y="3" width="12" height="12" rx="2"/></svg>
      Check overlaps
      </button>
      <div class="filters-summary" data-filters-summary hidden></div>
      <div class="filters-panel" id="filters-panel" data-filters-panel hidden>
        <div class="filter-field"><label for="f-portal">Portal</label>
          <select class="input" id="f-portal"><option value="" data-placeholder>Portal</option><option value="*">All</option></select></div>
        <div class="filter-field"><label for="f-agent">Client</label>
          <select class="input" id="f-agent"><option value="" data-placeholder>Client</option><option value="*">All clients</option></select></div>
        <div class="filter-field"><label for="f-market">Market</label>
          <select class="input" id="f-market"><option value="" data-placeholder>Market</option></select></div>
        <div class="filter-field"><label for="f-api">Supplier</label>
          <select class="input" id="f-api"><option value="" data-placeholder>Supplier</option></select></div>
        <div class="filter-field"><label for="f-status">Status</label>
          <select class="input" id="f-status"><option value="" data-placeholder>All statuses</option><option value="active">Active</option><option value="inactive">Inactive</option></select></div>
      </div>
    </div>

    <!-- Portal reusable table (css/table.css) — format fixed; only columns/cell content are page-specific -->
    <div class="tbl-area">
      <div class="table-responsive">
        <table class="table table-hover table-striped table-bordered f-14 text-nowrap">
          <thead>
            <tr class="text-uppercase">
              <th class="tbl-num" scope="col">#</th><th class="text-start tbl-fit">ID</th><th class="text-start">Market</th><th class="text-start">Supplier</th><th class="text-start tbl-fit">Portal / Client</th><th class="text-end tbl-fit">Markup</th><th class="tbl-fit">Status</th><th class="tbl-action-col">Action</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <nav class="pagination" id="pager" aria-label="Hotel markup pagination">
        <p aria-live="polite" class="pagination__summary"><span class="pagination__summary-label">Showing</span><strong class="pagination__range" id="pg-range"></strong><span>of</span><strong id="pg-total"></strong></p>
        <div class="pagination__navigation">
          <button type="button" aria-label="Go to previous page" class="pagination__direction" id="pg-prev"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m12.5 15-5-5 5-5"></path></svg><span>Previous</span></button>
          <div aria-label="Choose a page" class="pagination__pages" id="pg-pages"></div>
          <span class="pagination__mobile-position" id="pg-mobile"></span>
          <button type="button" aria-label="Go to next page" class="pagination__direction" id="pg-next"><span>Next</span><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m7.5 5 5 5-5 5"></path></svg></button>
        </div>
        <label class="pagination__page-size"><span class="pagination__page-size-label">Rows</span>
          <select aria-label="Rows per page" id="pg-size"><option value="20">20</option><option value="50">50</option><option value="100">100</option></select></label>
      </nav>
    </div>
  </section>
</main>

<!-- Create / edit drawer -->
<aside class="drawer" id="edit-drawer" role="dialog" aria-modal="true" aria-labelledby="edit-title">
  <div class="drawer-head">
    <div><h2 id="edit-title">New markup</h2></div>
    <button class="icon-btn" type="button" data-close aria-label="Close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  </div>
  <form class="drawer-body" id="edit-form" novalidate>
    <div class="form-section">
      <h3>Portal &amp; client</h3>
      <div class="field">
        <label for="e-portal">Portal</label>
        <select class="input" id="e-portal" name="portal"><option value="">All</option></select>
      </div>
      <div class="field" id="e-agent-field" style="margin-top:14px" hidden>
        <label for="e-agent">Client</label>
        <select class="input" id="e-agent" name="agent"><option value="">All clients</option></select>
      </div>
    </div>

    <div class="form-section">
      <h3>Applies to</h3>
      <div class="field" style="margin-bottom:14px">
        <label for="e-api">APIs<span class="req">*</span></label>
        <select class="input" id="e-api" name="api" multiple data-unit="API" placeholder="Select APIs"><option value="*">All suppliers</option></select>
        <span class="hint" id="e-api-hint"></span>
        <span class="err" data-msg>Select an API.</span>
      </div>
      <div class="field">
        <label for="e-markets">Markets<span class="req">*</span></label>
        <select class="input" id="e-markets" name="markets" multiple data-unit="market" placeholder="Select markets"><option value="*">All markets</option></select>
        <span class="err" data-msg></span>
      </div>
    </div>

    <div class="form-section">
      <h3>Markup</h3>
      <div class="grid-2">
        <div class="field">
          <span class="lbl" id="e-type-l">Markup type<span class="req">*</span></span>
          <div class="seg seg-radio" role="radiogroup" aria-labelledby="e-type-l">
            <label><input type="radio" name="type" value="percent">Percent</label>
            <label><input type="radio" name="type" value="fixed">Fixed</label>
          </div>
        </div>
        <div class="field">
          <label for="e-amount">Markup amount<span class="req">*</span></label>
          <div class="input-affix"><input class="input" id="e-amount" name="amount" inputmode="decimal" placeholder="0.00"><span class="affix" id="e-amount-unit">%</span></div>
          <span class="err" data-msg>Enter a markup amount.</span>
        </div>
      </div>
    </div>

    <div class="form-section">
      <h3>Status</h3>
      <div class="toggle-list">
        <label class="toggle-row"><div><div class="t">Active</div><div class="d">Inactive markups are not added to hotel prices.</div></div>
          <span class="switch"><input type="checkbox" name="active"><span></span></span></label>
      </div>
    </div>
  </form>
  <div class="drawer-foot">
    <!-- optional: when ticked, Save first shows any overlaps with other rules -->
    <label class="ovl-opt"><input type="checkbox" id="e-check-ovl">Check for overlaps</label>
    <button class="btn btn-secondary" type="button" data-close>Cancel</button>
    <button class="btn btn-primary" type="submit" form="edit-form" id="edit-submit">Create markup</button>
  </div>
</aside>
<div class="drawer-backdrop" data-close></div>

<!-- History drawer -->
<aside class="drawer" id="hist-drawer" role="dialog" aria-modal="true" aria-labelledby="hist-title">
  <div class="drawer-head">
    <h2 id="hist-title">History <span class="hist-name" id="hist-name"></span></h2>
    <button class="icon-btn" type="button" data-close aria-label="Close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  </div>
  <div class="drawer-body" id="hist-body"></div>
</aside>
<div class="drawer-backdrop" data-close></div>

<!-- Delete: confirm -->

<div class="toast" id="toast" role="status"></div>

<script src="js/shell.js?v=31"></script>
<script src="js/select.js?v=27"></script>
<script src="js/tooltip.js?v=2"></script>
<script src="js/modal.js?v=1"></script>
<script src="js/filters.js?v=1"></script>
<script src="js/history-legacy.js?v=3"></script>
<script src="js/empty-state.js?v=3"></script>
<script src="js/table-loading.js?v=1"></script>
<script src="js/markup-commission.js?v=88"></script>
</body>
</html>
