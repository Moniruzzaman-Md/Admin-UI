<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Portal Redesign</title>
<link rel="stylesheet" href="css/skeleton.css">
<style>
  body { margin: 0; padding: 32px 16px; font-family: system-ui, sans-serif; background: #f9fafb; color: #111827; }
  main { max-width: 880px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.sub { margin: 0 0 24px; color: #6b7280; font-size: 14px; }
  table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; overflow: hidden; font-size: 14px; }
  th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid #f3f4f6; }
  th { background: #f9fafb; font-weight: 600; color: #374151; }
  td.empty { color: #9ca3af; text-align: center; padding: 24px; }
</style>
</head>
<body>
<main>
  <h1>Admin Portal Redesign</h1>
  <p class="sub">Each screen fills in section by section. Grey blocks are sections that haven't been redesigned yet.</p>
  <table>
    <thead><tr><th>Screen</th><th>Progress</th><th>Status</th><th>Last change</th></tr></thead>
    <tbody>
      <tr><td class="empty" colspan="4">No screens yet</td></tr>
    </tbody>
  </table>
</main>
</body>
</html>
