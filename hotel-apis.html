<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hotel Supplier List · Admin Redesign</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32x32.png?v=2">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon/favicon-16x16.png?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.png?v=2">
<link rel="stylesheet" href="css/tokens.css?v=27">
<link rel="stylesheet" href="css/shell.css?v=33">
<link rel="stylesheet" href="css/components.css?v=51">
<link rel="stylesheet" href="css/skeleton.css?v=27">
<link rel="stylesheet" href="css/table.css?v=77">
<link rel="stylesheet" href="css/select.css?v=27">
<link rel="stylesheet" href="css/modal.css?v=3">
<link rel="stylesheet" href="css/history.css?v=34">
<style>
  .toolbar .search-input { flex: 1 1 260px; max-width: 340px; }
  .toolbar .searchable-select { width: 190px; }
  .toolbar .spacer { flex: 1; }
</style>
</head>
<body data-page="hotel-apis">

<main class="shell-main">
  <div class="page-head">
    <div>
      <h1 class="page-title">Supplier List</h1>
    </div>
    <button class="btn btn-primary" id="btn-new" type="button">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      New supplier
    </button>
  </div>

  <section class="card" aria-label="Supplier list">
    <div class="toolbar">
      <div class="search-input">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input class="input" id="f-q" type="search" placeholder="Search name or code" aria-label="Search by supplier name or code">
      </div>
      <select class="input" id="f-currency" aria-label="Currency"><option value="">Currency</option></select>
      <select class="input" id="f-status" aria-label="Status">
        <option value="">Status</option><option value="active">Active</option><option value="inactive">Inactive</option>
      </select>
      <button class="btn btn-reset" id="f-clear" type="button">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 12a9 9 0 109-9 9 9 0 00-7 3.3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M3 3.5V8h4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Reset
      </button>
    </div>

    <!-- Portal reusable table (css/table.css) — format fixed; only columns/cell content are page-specific -->
    <div class="tbl-area">
      <div class="table-responsive">
        <table class="table table-hover table-striped table-bordered f-14 text-nowrap">
          <thead>
            <tr class="text-uppercase">
              <th class="tbl-num" scope="col">#</th><th class="text-start">Name</th><th>Supplier code</th><th>Reference code</th><th>Currency</th><th>Status</th>
              <th>Short code</th><th>Allow B2C</th><th>Hold booking</th><th class="tbl-action-col">Action</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <nav class="pagination" id="pager" aria-label="Supplier list pagination">
        <p aria-live="polite" class="pagination__summary"><span class="pagination__summary-label">Showing</span><strong class="pagination__range" id="pg-range"></strong><span>of</span><strong id="pg-total"></strong></p>
        <div class="pagination__navigation">
          <button type="button" aria-label="Go to previous page" class="pagination__direction" id="pg-prev"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m12.5 15-5-5 5-5"></path></svg><span>Previous</span></button>
          <div aria-label="Choose a page" class="pagination__pages" id="pg-pages"></div>
          <span class="pagination__mobile-position" id="pg-mobile"></span>
          <button type="button" aria-label="Go to next page" class="pagination__direction" id="pg-next"><span>Next</span><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m7.5 5 5 5-5 5"></path></svg></button>
        </div>
        <label class="pagination__page-size"><span class="pagination__page-size-label">Rows</span>
          <select aria-label="Rows per page" id="pg-size"><option value="20">20</option><option value="50">50</option><option value="100">100</option></select></label>
      </nav>
    </div>
  </section>
</main>


<!-- History drawer -->
<aside class="drawer" id="hist-drawer" role="dialog" aria-modal="true" aria-labelledby="hist-title">
  <div class="drawer-head">
    <h2 id="hist-title">History <span class="hist-name" id="hist-name"></span></h2>
    <button class="icon-btn" type="button" data-close aria-label="Close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  </div>
  <div class="drawer-body" id="hist-body"></div>
</aside>
<div class="drawer-backdrop" data-close></div>


<div class="toast" id="toast" role="status"></div>

<style>.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}</style>
<script src="js/shell.js?v=38"></script>
<script src="js/select.js?v=28"></script>
<script src="js/tooltip.js?v=3"></script>
<script src="js/modal.js?v=2"></script>
<script src="js/history-legacy.js?v=4"></script>
<script src="js/data.js?v=12"></script>
<script src="js/api-drawer.js?v=17"></script>
<script src="js/empty-state.js?v=4"></script>
<script src="js/table-loading.js?v=2"></script>
<script src="js/hotel-apis.js?v=50"></script>
</body>
</html>
