<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hotel Api Logs · Admin Redesign</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32x32.png?v=2">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon/favicon-16x16.png?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.png?v=2">
<link rel="stylesheet" href="css/tokens.css?v=26">
<link rel="stylesheet" href="css/shell.css?v=30">
<link rel="stylesheet" href="css/components.css?v=48">
<link rel="stylesheet" href="css/skeleton.css?v=26">
<link rel="stylesheet" href="css/table.css?v=70">
<link rel="stylesheet" href="css/select.css?v=26">
<link rel="stylesheet" href="css/datepicker.css?v=2">
<style>
  .page-head { padding: 0 8px; }

  /* log viewer drawer — compact: everything but the file content fits in the header + one info line */
  #log-drawer .drawer-head { align-items: center; padding: 12px 16px 12px 20px; }
  #log-drawer .drawer-head .head-main { display: flex; align-items: center; gap: 14px; min-width: 0; flex: 1; }
  #log-drawer .drawer-head h2 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 3em; }
  #log-drawer .seg button { height: 26px; padding: 0 10px; }
  #log-drawer .drawer-body { display: flex; flex-direction: column; gap: 10px; overflow: hidden; padding: 12px 20px 16px; }
  /* one line: Transaction ID | Supplier | file name (one line, cut in the middle to fit, like the list) + copy */
  .log-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 0; font-size: var(--fs-sm); color: var(--text-2); }
  .log-meta > * + * { margin-left: 12px; padding-left: 12px; border-left: 1px solid var(--border-strong); }
  .log-meta .lm-sup { color: var(--text); font-weight: 600; white-space: nowrap; }
  .log-meta .lm-file { display: inline-flex; align-items: center; gap: 4px; flex: 1 1 260px; min-width: 0; }
  .log-meta .lm-file .tbl-mid { flex: 0 1 auto; width: auto; min-width: 0; color: var(--text-2); }
  .log-meta .lm-file .icon-btn { width: 24px; height: 24px; flex: none; }
  #log-drawer .code-view-bar { padding: 6px 8px; }
  .cv-panes { flex: 1; min-height: 0; display: flex; gap: 12px; }
  #log-drawer .code-view { flex: 1 1 0; min-width: 0; }
  #log-drawer .code-view[hidden], .log-meta .lm-file[hidden], .cv-kind[hidden] { display: none; }
  .cv-editor { flex: 1; min-height: 0; }
  /* side by side: wider drawer, Request left · Response right, each pane names its file */
  #log-drawer.is-split { width: min(1480px, 100vw); }
  /* the drawer grows / shrinks smoothly when side by side turns on / off (only while open, not while it slides in) */
  #log-drawer.open.can-resize { transition: transform .25s ease, width .32s cubic-bezier(.2, .8, .2, 1); }
  #log-drawer.can-resize .code-view.is-entering { animation: cv-pane-in .32s cubic-bezier(.2, .8, .2, 1); }
  @keyframes cv-pane-in { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { #log-drawer.open.can-resize { transition: transform .25s ease; } #log-drawer .code-view.is-entering { animation: none; } }
  .cv-kind { font-size: var(--fs-sm); font-weight: 700; margin-right: 2px; cursor: default; }
  .cv-kind.is-request { color: #1d4ed8; } .cv-kind.is-response { color: #15803d; }
  @media (max-width: 1099.98px) { #sw-kind .sw-both { display: none; } }
  /* the viewer opens on top of the timeline */
  #log-drawer { z-index: 120; } #log-drawer + .drawer-backdrop { z-index: 110; }
  .log-nav { display: flex; align-items: center; gap: 2px; margin-right: 4px; }
  .log-nav[hidden] { display: none; }
  .log-nav-pos { min-width: 54px; text-align: center; font-size: var(--fs-xs); color: var(--text-3); font-variant-numeric: tabular-nums; }
  .log-nav .icon-btn:disabled { opacity: .35; cursor: default; background: none; }
  /* transaction timeline */
  #txn-drawer .drawer-head { align-items: center; padding: 12px 16px 12px 20px; }
  #txn-drawer .drawer-head .head-main { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; }
  #txn-drawer .drawer-head .btn { height: 32px; }
  #txn-drawer .drawer-body { padding: 12px 20px 20px; }
  .tl-meta { display: flex; flex-wrap: wrap; align-items: center; font-size: var(--fs-sm); color: var(--text-2); margin-bottom: 14px; }
  .tl-meta > * + * { margin-left: 12px; padding-left: 12px; border-left: 1px solid var(--border-strong); }
  .tl-meta b { color: var(--text); font-weight: 600; }
  .tl { list-style: none; margin: 0; padding: 0; position: relative; }
  .tl::before { content: ''; position: absolute; left: 5px; top: 8px; bottom: 8px; width: 2px; background: #e4e6f7; }
  .tl-call { position: relative; padding: 0 0 14px 24px; }
  .tl-call::before { content: ''; position: absolute; left: 0; top: 5px; width: 12px; height: 12px; border-radius: 50%; background: #fff; border: 2px solid #2b3ed1; box-sizing: border-box; }
  .tl-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
  /* a call's header folds its files: whole header is the toggle, chevron on the right, file count while folded */
  button.tl-head { width: 100%; margin: 0 0 6px; padding: 2px 4px 2px 0; border: 0; border-radius: var(--radius-sm); background: none; font: inherit; text-align: left; cursor: pointer; }
  button.tl-head:hover .tl-chev, button.tl-head:focus-visible .tl-chev { color: var(--text); }
  button.tl-head:focus-visible { outline: 2px solid #9ec5fe; outline-offset: 2px; }
  .tl-head .tl-chev { flex: none; align-self: center; margin-left: auto; color: var(--text-3); transition: transform .15s; }
  .tl-head .tl-dur ~ .tl-chev { margin-left: 0; }
  .tl-call:not(.is-collapsed) .tl-head .tl-count { display: none; }
  .tl-call.is-collapsed .tl-chev { transform: rotate(-90deg); }
  .tl-call.is-collapsed .tl-files, .tl-call.is-collapsed .tl-load { display: none; }
  .tl-call.is-collapsed button.tl-head { margin-bottom: 0; }
  .tl-head .tl-time { font-size: var(--fs-xs); color: var(--text-3); font-variant-numeric: tabular-nums; min-width: 78px; }
  .tl-head b { font-size: var(--fs-md); color: var(--text); }
  .tl-head .tl-sup { font-size: var(--fs-sm); color: var(--text-2); }
  .tl-head .tl-dur { margin-left: auto; padding: 1px 8px; border-radius: 999px; background: #ececfa; color: #10108a; font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .tl-files { list-style: none; margin: 0 0 0 88px; padding: 0; border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; }
  .tl-files li + li { border-top: 1px solid var(--border); }
  .tl-file { display: flex; align-items: center; gap: 12px; width: 100%; padding: 6px 10px; border: 0; background: #fff; font: 12px var(--font); color: var(--text-2); text-align: left; cursor: pointer; }
  .tl-file:hover, .tl-file:focus-visible { background: #f3f4fd; outline: 0; }
  .tl-file.is-last-opened { background: #eef0ff; box-shadow: inset 3px 0 0 #2b3ed1; }
  .tl-file .tbl-mid { flex: 1 1 auto; width: auto; min-width: 0; }
  .tl-file .tl-fsup { flex: none; color: var(--text-2); font-weight: 500; }
  .tl-file .tl-ftime { flex: none; color: var(--text-3); font-variant-numeric: tabular-nums; }
  .tl-head .tl-count { padding: 1px 8px; border-radius: 999px; background: #f1f1f6; color: #4a4a66; font-size: 11px; font-weight: 700; }
  .tl-more { padding: 9px 10px; display: flex; align-items: center; background: #fbfbfe; }
  .tl-load { margin: 4px 0 0 24px; }
  .tl-call .tl-load { margin: 6px 0 0 88px; }
  .tl-load .btn { height: 28px; font-size: var(--fs-sm); }
  .tl-load .btn span { color: var(--text-3); font-weight: 400; }
  .tl-load .skeleton-bar { display: block; width: 220px; height: 28px; border-radius: var(--radius-sm); background: linear-gradient(90deg, #e4e6f7 25%, #f3f4fc 40%, #e4e6f7 60%); background-size: 300% 100%; animation: skeleton-shimmer 1.3s ease-in-out infinite; }
  .tl-more .skeleton-bar { display: block; height: 11px; border-radius: 999px; background: linear-gradient(90deg, #e4e6f7 25%, #f3f4fc 40%, #e4e6f7 60%); background-size: 300% 100%; animation: skeleton-shimmer 1.3s ease-in-out infinite; }
  .tl-skel { display: flex; flex-direction: column; gap: 16px; }
  .tl-skel .skeleton-bar { display: block; height: 11px; border-radius: 999px; background: linear-gradient(90deg, #e4e6f7 25%, #f3f4fc 40%, #e4e6f7 60%); background-size: 300% 100%; animation: skeleton-shimmer 1.3s ease-in-out infinite; }
  .code-view-bar .searchable-select:has(.cv-format) { width: 96px; }
  .code-view-bar .searchable-select:has(.cv-format) .input { height: 32px; font-size: var(--fs-sm); font-weight: 600; }
  .ph-only { display: none; }

  /* ---------- phones (≤ 640px) ---------- */
  @media (max-width: 640px) {
    /* list: no scroll box inside the card — the page scrolls; each row is a card:
       operation + file name (one line, cut in the middle like desktop) / transaction ID + portal / date · time + supplier */
    .shell-main { height: auto; }
    .tbl-area, .tbl-area .table-responsive { flex: none; overflow: visible; }
    .table.log-table, .log-table tbody, .log-table tr { display: block; border: 0; }
    .log-table thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    .table.log-table tbody tr { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "op op" "txn txn" "date sup"; gap: 6px 12px; padding: 12px 14px; border-bottom: 1px solid var(--border); }
    .table.log-table tbody tr > td { display: block; padding: 0; border: 0; background: none !important; box-shadow: none !important; white-space: normal !important; }
    .table.log-table tbody tr.is-last-opened { background: #eef0ff; box-shadow: inset 3px 0 0 #2b3ed1; }
    .log-table td.tbl-num { display: none !important; }
    .log-table td:nth-child(2) { grid-area: date; }
    .log-table td:nth-child(3) { grid-area: txn; }
    .log-table td:nth-child(5) { grid-area: op; }
    .log-table td:nth-child(4) { grid-area: sup; align-self: end; text-align: right; font-weight: 600; }
    .log-table td:nth-child(2) .tbl-stack { flex-direction: row; flex-wrap: wrap; gap: 0 8px; font-size: 13px; color: var(--text-2); }
    .log-table td:nth-child(3) .tbl-stack { flex-direction: row; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
    .table.log-table tbody tr:has(td.empty-cell) { display: block; padding: 0; border: 0; }
    .skeleton .log-table tbody td { height: auto; }
    .skeleton .log-table td:nth-child(5) .skeleton-bar { width: 85% !important; }
    .skeleton .log-table td:nth-child(4) .skeleton-bar { width: 56px !important; }

    /* drawers: tighter padding; header items wrap onto a second row */
    #txn-drawer .drawer-head, #log-drawer .drawer-head { flex-wrap: wrap; row-gap: 8px; padding: 10px 10px 10px 16px; }
    #txn-drawer .drawer-body { padding: 10px 14px 16px; }
    #log-drawer .drawer-body { padding: 10px 12px 12px; gap: 8px; }

    /* timeline header: Transaction · Show in list · ✕, then the ID on its own row */
    #txn-drawer .drawer-head .head-main { display: contents; }
    #txn-title { order: 1; flex: 1; }
    #txn-filter { order: 2; }
    #txn-drawer .drawer-head [data-close] { order: 3; }
    #txn-id { order: 4; flex-basis: 100%; }
    /* timeline: no indent under the time, so file names get the width */
    .tl-head { gap: 2px 8px; }
    .tl-head b { order: 1; } .tl-head .tl-sup { order: 2; }
    .tl-head .tl-time { order: 3; min-width: 0; margin-left: auto; }
    .tl-head .tl-dur { order: 4; margin-left: 0; }
    .tl-head .tl-count { order: 2; }
    .tl-head .tl-chev { order: 5; margin-left: 0; }
    .tl-files, .tl-call .tl-load { margin-left: 0; }
    .tl-file { gap: 8px; padding: 6px 8px; }

    /* viewer header: title + ✕, then Request | Response and prev / next */
    #log-drawer .drawer-head .head-main { display: contents; }
    #log-title { order: 1; flex: 1 1 calc(100% - 48px); }
    #log-drawer .drawer-head [data-close] { order: 2; }
    #sw-kind { order: 3; }
    #log-nav { order: 4; margin: 0 0 0 auto; }
    /* viewer bar on one row: Find, Copy, Download become icon buttons */
    #log-drawer .code-view-bar { gap: 4px; padding: 6px; flex-wrap: nowrap; }
    .code-view-bar .searchable-select:has(.cv-format) { width: 76px; flex: none; }
    .code-view-bar .searchable-select:has(.cv-format) .searchable-select-trigger { padding: 0 6px 0 9px; gap: 2px; }
    #log-drawer .code-view-bar .inline-switch { gap: 6px; }
    .ph-only { display: inline; }
    .cv-find, .cv-fold, .cv-copy, .cv-download { width: 32px; min-width: 0; padding: 0; justify-content: center; }
    .cv-find .btn-label, .cv-fold .btn-label, .cv-copy .btn-label, .cv-download .btn-label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  }
</style>
</head>
<body data-page="hotel-api-logs">

<main class="shell-main">
  <div class="page-head">
    <div>
      <h1 class="page-title">Hotel API Logs</h1>
    </div>
  </div>

  <section class="card" aria-label="Hotel API logs">
    <div class="filter-bar" id="filter-bar">
      <div class="search-input">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input class="input" id="f-txn" type="text" placeholder="Transaction ID" aria-label="Transaction ID" autocomplete="off" spellcheck="false">
      </div>
      <button class="btn btn-primary" type="button" data-filters-go>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="7.5"/><path d="m20.5 20.5-4-4"/></svg>
        Search
      </button>
      <button class="filters-toggle-btn" type="button" data-filters-toggle aria-expanded="false" aria-controls="filters-panel">
        Filters <span class="filters-count" data-filters-count hidden></span>
        <svg class="chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="btn btn-reset" type="button" data-filters-reset>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 12a9 9 0 109-9 9 9 0 00-7 3.3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M3 3.5V8h4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Reset
      </button>
      <div class="filters-summary" data-filters-summary hidden></div>
      <div class="filters-panel" id="filters-panel" data-filters-panel hidden>
        <div class="filter-field"><label for="f-from">From date</label>
          <div class="date-input"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><input class="input" id="f-from" type="text" readonly></div></div>
        <div class="filter-field"><label for="f-to">To date</label>
          <div class="date-input"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><input class="input" id="f-to" type="text" readonly></div></div>
        <div class="filter-field"><label for="f-api">Supplier</label>
          <select class="input" id="f-api"><option value="" data-placeholder>Supplier</option></select></div>
        <div class="filter-field"><label for="f-op">Operation type</label>
          <select class="input" id="f-op"><option value="" data-placeholder>Operation type</option></select></div>
        <div class="filter-field"><label for="f-portal">Portal</label>
          <select class="input" id="f-portal"><option value="" data-placeholder>Portal</option></select></div>
        <div class="filter-field filter-field--toggle">
          <label class="inline-switch"><span class="switch"><input type="checkbox" id="f-search"><span></span></span>Include search logs</label></div>
      </div>
    </div>

    <!-- Portal reusable table (css/table.css) — format fixed; only columns/cell content are page-specific -->
    <div class="tbl-area">
      <div class="table-responsive">
        <table class="table log-table table-hover table-striped table-bordered f-14 text-nowrap">
          <thead>
            <tr class="text-uppercase">
              <th class="tbl-num" scope="col">#</th><th class="text-start">Date &amp; Time</th><th class="text-start">Transaction ID</th><th>Supplier</th>
              <th class="text-start tbl-grow">Operation</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <nav class="pagination" id="pager" aria-label="Hotel API logs pagination">
        <p aria-live="polite" class="pagination__summary"><span class="pagination__summary-label">Showing</span><strong class="pagination__range" id="pg-range"></strong><span>of</span><strong id="pg-total"></strong></p>
        <div class="pagination__navigation">
          <button type="button" aria-label="Go to previous page" class="pagination__direction" id="pg-prev"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m12.5 15-5-5 5-5"></path></svg><span>Previous</span></button>
          <div aria-label="Choose a page" class="pagination__pages" id="pg-pages"></div>
          <span class="pagination__mobile-position" id="pg-mobile"></span>
          <button type="button" aria-label="Go to next page" class="pagination__direction" id="pg-next"><span>Next</span><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m7.5 5 5 5-5 5"></path></svg></button>
        </div>
        <label class="pagination__page-size"><span class="pagination__page-size-label">Rows</span>
          <select aria-label="Rows per page" id="pg-size"><option value="20">20</option><option value="50">50</option><option value="100">100</option></select></label>
      </nav>
    </div>
  </section>
</main>

<!-- Transaction timeline drawer -->
<aside class="drawer drawer-wide" id="txn-drawer" role="dialog" aria-modal="true" aria-labelledby="txn-title">
  <div class="drawer-head">
    <div class="head-main"><h2 id="txn-title">Transaction</h2><span id="txn-id"></span></div>
    <button class="btn btn-secondary" type="button" id="txn-filter">Show in list</button>
    <button class="icon-btn" type="button" data-close aria-label="Close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  </div>
  <div class="drawer-body" id="txn-body"></div>
</aside>
<div class="drawer-backdrop" data-close></div>

<!-- Log viewer drawer -->
<aside class="drawer drawer-wide" id="log-drawer" role="dialog" aria-modal="true" aria-labelledby="log-title">
  <div class="drawer-head">
    <div class="head-main">
      <h2 id="log-title">Log</h2>
      <div class="seg" role="group" aria-label="Request or response" id="sw-kind" hidden></div>
    </div>
    <div class="log-nav" id="log-nav">
      <button class="icon-btn" type="button" id="nav-prev" data-tooltip="Previous file (↑)" aria-label="Previous file"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 15 6-6 6 6"/></svg></button>
      <span class="log-nav-pos" id="nav-pos"></span>
      <button class="icon-btn" type="button" id="nav-next" data-tooltip="Next file (↓)" aria-label="Next file"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
    </div>
    <button class="icon-btn" type="button" data-close aria-label="Close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  </div>
  <div class="drawer-body">
    <div class="log-meta">
      <span id="lm-txn"></span>
      <span class="lm-sup" id="lm-api" data-tooltip="Supplier" tabindex="0"></span>
      <span class="lm-file"><span class="tbl-mid" id="lm-file" tabindex="0"></span>
        <button class="icon-btn" type="button" id="lm-copy-file" data-tooltip="Copy file name" aria-label="Copy file name"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="8.5" y="8.5" width="12" height="12" rx="2"/><path d="M15.5 8.5V5.5a2 2 0 0 0-2-2h-8a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h3"/></svg></button></span>
    </div>

    <!-- one content pane, or Request | Response side by side (built by js/hotel-api-logs.js) -->
    <div class="cv-panes" id="cv-panes"></div>
  </div>
</aside>
<div class="drawer-backdrop" data-close></div>

<div class="toast" id="toast" role="status"></div>

<script src="js/shell.js?v=31"></script>
<script src="js/select.js?v=27"></script>
<script src="js/tooltip.js?v=2"></script>
<script src="js/datepicker.js?v=2"></script>
<script src="js/filters.js?v=1"></script>
<script src="js/empty-state.js?v=3"></script>
<script src="js/table-loading.js?v=1"></script>
<script src="js/code-viewer.js?v=6"></script>
<script src="js/hotel-api-logs.js?v=57"></script>
</body>
</html>
